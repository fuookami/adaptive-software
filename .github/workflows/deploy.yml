name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'i18n/**'
      - 'styles/**'
      - 'README.md'
      - 'gitbook-docs.yaml'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'i18n/**'
      - 'styles/**'
      - 'gitbook-docs.yaml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 校验并构建双语静态站（Honkit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 校验书稿结构（中文书根的 SUMMARY.md ↔ 页面）
        run: node tools/split-book.mjs --check

      - name: 校验图示源码结构（块闭合 / 无空行 / 顶格 / 无 Markdown 残留）
        run: node tools/check-diagrams.mjs --structure

      - name: 校验图示导出（SVG 引用完整、正文无残留 HTML 块）
        run: node tools/export-diagrams.mjs --check

      - name: 校验双语一致性（页面、导航、书根配置、站点映射）
        run: node tools/check-i18n.mjs

      - name: 校验 GitBook 站点配置符合官方 schema
        run: node tools/check-gitbook-yaml.mjs

      - name: 构建 zh 与 en 两版站点
        run: node tools/build-site.mjs

      - name: 上传 Pages 产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_book

  deploy:
    name: 发布到 GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages 没启用时，deploy-pages 只会抛一句 “Failed to create deployment (status: 404)”，
      # 看不出该点哪里。这里先查一次 Pages 配置，把失败原因翻译成可执行的指引。
      - name: 预检 GitHub Pages 是否启用（来源须为 GitHub Actions）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          resp=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pages")
          code=$(printf '%s' "$resp" | tail -n 1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "Pages API 返回 HTTP $code"

          case "$code" in
            200)
              build_type=$(printf '%s' "$body" \
                | grep -o '"build_type"[[:space:]]*:[[:space:]]*"[^"]*"' \
                | head -n 1 | sed 's/.*"\([^"]*\)"$/\1/') || true
              if [ -n "$build_type" ] && [ "$build_type" != "workflow" ]; then
                echo "::error title=Pages 构建来源不是 GitHub Actions::当前 build_type=${build_type}。请到 Settings → Pages → Build and deployment → Source 改成 “GitHub Actions”，保存后重跑本工作流。"
                exit 1
              fi
              echo "✓ Pages 已启用，来源为 GitHub Actions（build_type=${build_type:-未知}）"
              ;;
            404)
              echo "::error title=GitHub Pages 尚未启用::此仓库还没有 Pages 站点，所以无法创建部署（404）。到 https://github.com/${{ github.repository }}/settings/pages 把 Build and deployment → Source 选为 “GitHub Actions” 并保存，然后在 Actions 页面点 Re-run 重跑即可。书稿校验与构建已成功，无需重新提交代码。"
              exit 1
              ;;
            401|403)
              echo "::warning::无法读取 Pages 配置（HTTP $code），跳过预检，直接尝试部署"
              ;;
            *)
              echo "::warning::Pages 预检返回 HTTP $code，跳过预检，直接尝试部署"
              ;;
          esac

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
