name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'i18n/**'
      - 'styles/**'
      - 'README.md'
      - 'gitbook-docs.yaml'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'i18n/**'
      - 'styles/**'
      - 'gitbook-docs.yaml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 校验并构建双语静态站（Honkit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 校验书稿结构（中文书根的 SUMMARY.md ↔ 页面）
        run: node tools/split-book.mjs --check

      - name: 校验图示 HTML 结构（块闭合 / 无空行 / 顶格 / 无 Markdown 残留）
        run: node tools/check-diagrams.mjs --structure

      - name: 校验双语一致性（页面、导航、书根配置、站点映射）
        run: node tools/check-i18n.mjs

      - name: 构建 zh 与 en 两版站点
        run: node tools/build-site.mjs

      - name: 上传 Pages 产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_book

  deploy:
    name: 发布到 GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
