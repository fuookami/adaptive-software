<text x="640.73" y="68.77" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">基于跨时间、跨客户的真实运行重复证据</text>
<text x="640.73" y="92.73" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">管理共性（Commonality）与可变性（Variability）</text>
<text x="640.72" y="116.68" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">使命：高可靠吸收“已被证明有效的变化”</text>
