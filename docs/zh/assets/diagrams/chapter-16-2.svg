<svg xmlns="http://www.w3.org/2000/svg" width="860" height="499" viewBox="0 0 860 499" role="img">
<rect x="0" y="0" width="860" height="498.06" rx="12" fill="rgb(251, 252, 254)" stroke="rgb(227, 230, 234)" stroke-width="1"/>
<rect x="108.84" y="18.66" width="642.3" height="88.88" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.98" y="43.77" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">【第 0 层（Tier 0）：通用规划器与解释执行路径】</text>
<text x="429.98" y="68.77" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">适用对象：首次出现的未知需求、低频长尾探索、尚未达到晋升阈值的临时交互</text>
<text x="429.98" y="92.73" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">执行方式：LLM 语义前端生成候选 IR → 实时校验 → 通用查询规划器 / 通用约束注入</text>
<text x="422.63" y="124.11" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<text x="341.72" y="137.22" font-family="'Noto Sans SC'" font-size="11.776px" font-weight="500" fill="rgb(91, 107, 123)" text-anchor="start">画像达到第一级热点与稳定性阈值</text>
<rect x="108.84" y="144.02" width="642.3" height="184.63" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="169.04" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">【第 1 层（Tier 1）：受控确定性计划与参数化模板（主力固化层，覆盖 90%+ 场景）】</text>
<text x="429.98" y="194.29" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">适用对象：高频重复的业务查询、周期性复现的动态排产约束、稳定的客户流程组合</text>
<text x="429.98" y="218.24" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">固化产物：</text>
<text x="429.98" y="242.19" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">高频查询 → 查询中间表示 + 参数化查询计划 / 预编译 SQL 语句（Prepared Plan）</text>
<text x="429.98" y="266.14" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">高频规则 → 参数化 OSPF 动态约束模板（Constraint Template）</text>
<text x="429.98" y="290.1" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">高频表达式 → 冻结符号顺序的高性能编译求值器（Compiled Evaluator）</text>
<text x="429.99" y="313.81" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">稳定流转 → 标准工作流执行计划与工具调用链模板（Flow Plan）</text>
<text x="422.63" y="345.2" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<text x="282.88" y="358.54" font-family="'Noto Sans SC'" font-size="11.776px" font-weight="500" fill="rgb(91, 107, 123)" text-anchor="start">唯有性能瓶颈极显著、收益充分且产品边界已高度稳定时</text>
<rect x="108.84" y="365.13" width="642.3" height="112.81" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.98" y="390.13" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">【第 2 层（Tier 2）：受控代码制品与虚拟机插件（极致性能层）】</text>
<text x="429.98" y="415.37" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">适用对象：超高吞吐要求的核心算子、复杂自定义求值器或高频专用查询接口</text>
<text x="429.98" y="439.32" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">固化产物：受控 JVM 编译查询接口插件 / 字节码制品 / WebAssembly (Wasm) 沙盒模块</text>
<text x="429.98" y="463.27" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">安全铁律：隔离构建进程、数字签名、依赖白名单、CPU/内存限制、独立类加载器/进程</text>
</svg>
