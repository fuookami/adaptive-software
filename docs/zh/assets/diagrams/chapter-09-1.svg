<svg xmlns="http://www.w3.org/2000/svg" width="860" height="688" viewBox="0 0 860 688" role="img">
<rect x="0" y="0" width="860" height="687.06" rx="12" fill="rgb(251, 252, 254)" stroke="rgb(227, 230, 234)" stroke-width="1"/>
<rect x="108.84" y="18.66" width="642.3" height="64.94" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="43.77" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">1. 领域驱动设计（定义世界）</text>
<text x="429.98" y="68.77" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">明确概念、限界上下文、不变量与状态角色所有权</text>
<text x="422.63" y="100.16" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<rect x="108.84" y="107.13" width="642.3" height="64.94" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="132.13" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">2. 领域语言（描述世界）</text>
<text x="429.99" y="157.37" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">转化为机器可读、可组合、可编译的形式化领域表示</text>
<text x="422.63" y="188.76" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<rect x="108.84" y="195.59" width="642.3" height="64.94" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="220.72" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">3. 事件溯源（记住世界）</text>
<text x="429.98" y="245.73" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">沉淀事实、决策、人工微调与规则版本的时间序列</text>
<text x="422.63" y="277.11" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<rect x="108.84" y="284.06" width="642.3" height="64.94" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="309.08" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">4. 数字孪生（推演世界）</text>
<text x="429.98" y="334.32" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">基于当前状态与共享计算模型，安全试演未来候选方案</text>
<text x="422.63" y="365.71" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<rect x="108.84" y="372.53" width="642.3" height="64.94" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="397.68" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">5. 产生式编程（产生能力）</text>
<text x="429.98" y="422.68" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">由语义中间表示自动编译生成查询、约束、流程或制品</text>
<text x="422.63" y="454.07" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<rect x="108.84" y="461" width="642.3" height="64.94" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="486.03" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">6. 形式化方法（验证能力）</text>
<text x="429.98" y="511.27" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">执行类型、量纲、权限、契约、等价性与影子运行验证</text>
<text x="422.63" y="542.66" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<rect x="108.84" y="549.47" width="642.3" height="64.94" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="574.63" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">7. 受控生产执行 → 产生新的领域事件</text>
<text x="429.99" y="599.63" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">投入真实业务运行，并将执行结果回流至事件记忆库</text>
<line x1="120.66" y1="625.88" x2="120.66" y2="666.94" stroke="rgb(230, 126, 34)" stroke-width="2" stroke-dasharray="5 4"/>
<text x="130.92" y="640.35" font-family="'Noto Sans SC'" font-size="13.248px" font-weight="400" fill="rgb(165, 91, 27)" text-anchor="start">↺ 从第 7 步回到第 3 步：7. 受控生产执行 → 产生新的领域事件，执行结果回流至事件记忆库 → 3. 事件溯</text>
<text x="130.92" y="660.75" font-family="'Noto Sans SC'" font-size="13.248px" font-weight="400" fill="rgb(165, 91, 27)" text-anchor="start">源（记住世界）</text>
</svg>
