<text x="252.36" y="356.3" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">（如订单交期准时率、减少换产总耗时、降低库存积压、</text>
