<text x="430" y="287.3" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 90, 104)" text-anchor="middle">软约束与多目标（Soft Constraints &amp; Objectives）</text>
<rect x="78.42" y="306.03" width="347.89" height="85" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
