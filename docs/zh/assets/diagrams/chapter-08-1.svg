<text x="252.36" y="193.5" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">（如设备物理容量上限、物料守恒平衡、共享投料口物理</text>
<text x="252.37" y="213.55" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">极限、法规红线）</text>
