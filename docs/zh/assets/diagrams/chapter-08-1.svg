<rect x="433.67" y="306.03" width="347.89" height="85" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="607.62" y="331.06" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">机制：</text>
<text x="607.62" y="356.3" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">通过 OSPF SlackFunction 与目标权重/罚系数转化为目</text>
<text x="607.62" y="376.35" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">标函数分项，支持按优先级或权重权衡！</text>
