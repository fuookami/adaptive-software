<svg xmlns="http://www.w3.org/2000/svg" width="860" height="508" viewBox="0 0 860 508" role="img">
<rect x="0" y="0" width="860" height="507.92" rx="12" fill="rgb(251, 252, 254)" stroke="rgb(227, 230, 234)" stroke-width="1"/>
<text x="430" y="34.7" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(29, 53, 87)" text-anchor="middle">【DDD 架构下的列生成（Column Generation）协作闭环】</text>
<rect x="108.84" y="56.19" width="642.3" height="112.81" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="81.17" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">1. 受限主问题（Restricted Master Problem, RMP —— 运筹主控层）</text>
<text x="429.99" y="106.42" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">• 仅包含当前已生成的有限个可行方案列（如单车配载路径列 / 单线排产列）</text>
<text x="429.99" y="130.37" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">• 负责全局耦合硬约束（订单全覆盖、共享投料口总量上限、全局库存平衡）</text>
<text x="429.98" y="154.32" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">• 求解线性松弛并输出当前对偶价格（Dual Prices / Shadow Prices）</text>
<text x="422.63" y="185.71" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<text x="324.06" y="198.81" font-family="'Noto Sans SC'" font-size="11.776px" font-weight="500" fill="rgb(91, 107, 123)" text-anchor="start">下发带对偶信息与业务边界的子问题契约</text>
<rect x="108.84" y="205.48" width="642.3" height="108.94" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="230.64" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">2. 定价子问题契约（Pricing Subproblem Contract —— 领域与算法解耦层）</text>
<text x="429.99" y="255.64" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">• 按独立限界上下文/聚合（如单台设备、单条产线、单辆货车）拆分子问题</text>
<text x="429.99" y="279.59" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">• 目标：寻找满足单资源局部工艺/时空约束、且约化成本（Reduced Cost）为负（最小化问题中）的新方</text>
<text x="429.98" y="299.64" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">案列</text>
<line x1="91.44" y1="318.59" x2="768.55" y2="318.59" stroke="rgb(164, 176, 190)" stroke-width="1"/>
<text x="253.34" y="335.03" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<text x="591.89" y="335.03" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<rect x="101.05" y="344.11" width="195.77" height="111.69" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="198.92" y="369.11" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">路径 A：加速/启发式器</text>
<text x="198.92" y="394.36" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">启发式 / 受控 RL 策略</text>
<text x="198.92" y="418.31" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">快速生成或排序候选列</text>
<text x="307.09" y="404.62" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">→</text>
<rect x="332.11" y="344.11" width="195.78" height="111.69" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="369.11" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">路径 B：精确子问题求解</text>
<text x="430" y="394.36" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">动态规划 / MILP / CP</text>
<text x="429.99" y="418.31" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">（负责收敛与最优证明）</text>
<text x="538.17" y="404.62" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">→</text>
<rect x="563.19" y="344.11" width="195.77" height="111.69" rx="9" fill="rgb(255, 249, 242)" stroke="rgb(230, 126, 34)" stroke-width="1"/>
<text x="661.07" y="369.11" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(165, 91, 27)" text-anchor="middle">3. 运筹验证守卫（OR</text>
<text x="661.07" y="391.97" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(165, 91, 27)" text-anchor="middle">Guard）</text>
<text x="661.07" y="417.21" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">• 独立校验领域硬约束可行性</text>
<text x="661.06" y="441.17" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">• 独立重算并核验约化成本</text>
<line x1="120.66" y1="467.27" x2="120.66" y2="487.8" stroke="rgb(230, 126, 34)" stroke-width="2" stroke-dasharray="5 4"/>
<text x="130.92" y="481.64" font-family="'Noto Sans SC'" font-size="13.248px" font-weight="400" fill="rgb(165, 91, 27)" text-anchor="start">↺ 回注经验证的改进列</text>
