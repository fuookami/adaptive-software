<svg xmlns="http://www.w3.org/2000/svg" width="860" height="644" viewBox="0 0 860 644" role="img">
<rect x="0" y="0" width="860" height="643.33" rx="12" fill="rgb(251, 252, 254)" stroke="rgb(227, 230, 234)" stroke-width="1"/>
<text x="430" y="34.7" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(29, 53, 87)" text-anchor="middle">[Benders decomposition collaboration loop under a DDD architecture]</text>
<rect x="108.84" y="56.19" width="642.3" height="152.94" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="81.17" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">1. Benders master problem (stage-one strategic / master-plan decisions)</text>
<text x="429.98" y="106.42" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">• Decides the core skeleton variables (e.g. cross-line task allocation, batch sizes, main resource</text>
<text x="429.99" y="126.46" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">start/stop)</text>
<text x="429.98" y="150.42" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">• Maintains a cut pool and keeps absorbing the feasibility and optimality cuts fed back by</text>
<text x="429.98" y="170.46" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">subproblems</text>
<text x="429.99" y="194.42" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">• Maintains and updates the global lower bound (for a minimization problem)</text>
<text x="422.63" y="225.81" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<text x="260.23" y="238.91" font-family="'Noto Sans SC'" font-size="11.776px" font-weight="500" fill="rgb(91, 107, 123)" text-anchor="start">Hands down the current master fixed solution (trial solution)</text>
<rect x="108.84" y="245.61" width="642.3" height="173" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="270.73" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">2. Benders subproblem group (stage-two per-workshop / per-scenario checks)</text>
<text x="429.99" y="295.74" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">• Solved independently and in parallel per bounded context or per random scenario under the</text>
<text x="429.98" y="315.78" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">master's fixed solution</text>
<text x="429.99" y="339.74" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">• If a subproblem is infeasible ──&gt; extract the extreme ray / Farkas proof and construct a Benders</text>
<text x="429.99" y="359.78" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">feasibility cut</text>
<text x="429.98" y="383.74" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">• If a subproblem has an optimum ──&gt; extract the dual multipliers, construct a Benders optimality</text>
<text x="429.99" y="403.78" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">cut and update the upper bound</text>
<text x="422.63" y="435.17" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<rect x="108.84" y="442.14" width="642.3" height="149.06" rx="9" fill="rgb(255, 249, 242)" stroke="rgb(230, 126, 34)" stroke-width="1"/>
<text x="429.99" y="467.14" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(165, 91, 27)" text-anchor="middle">3. Cut validity and convergence certification guard (Cut &amp; Convergence Guard)</text>
<text x="429.98" y="492.38" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">• Any candidate cut or scenario ordering proposed by a heuristic or learned policy must have its</text>
<text x="429.98" y="512.43" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">mathematical validity strictly verified from primal/dual information (it must never cut off the true</text>
<text x="429.98" y="532.48" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">global optimum!)</text>
<text x="429.99" y="556.43" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">• The master's upper/lower bounds (UB/LB) and the termination gap must be computed exactly by</text>
<text x="429.99" y="576.48" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">the certified subproblems!</text>
<line x1="120.66" y1="602.67" x2="120.66" y2="623.2" stroke="rgb(230, 126, 34)" stroke-width="2" stroke-dasharray="5 4"/>
<text x="130.92" y="617.19" font-family="'Noto Sans SC'" font-size="13.248px" font-weight="400" fill="rgb(165, 91, 27)" text-anchor="start">↺ Re-inject the certified feasibility / optimality cuts</text>
</svg>
