<svg xmlns="http://www.w3.org/2000/svg" width="860" height="682" viewBox="0 0 860 682" role="img">
<rect x="0" y="0" width="860" height="681.38" rx="12" fill="rgb(251, 252, 254)" stroke="rgb(227, 230, 234)" stroke-width="1"/>
<rect x="108.84" y="18.66" width="642.3" height="129" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.98" y="43.77" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">[Tier 0: general planner and interpreted execution path]</text>
<text x="429.99" y="68.77" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Who it serves: requirements never seen before, low-frequency long-tail exploration, temporary</text>
<text x="429.98" y="89.06" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">interactions that have not reached the promotion threshold</text>
<text x="429.98" y="112.77" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">How it executes: the LLM semantic frontend generates candidate IR → real-time validation → general</text>
<text x="429.98" y="133.06" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">query planner / general constraint injection</text>
<text x="422.63" y="164.21" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<text x="248.86" y="177.55" font-family="'Noto Sans SC'" font-size="11.776px" font-weight="500" fill="rgb(91, 107, 123)" text-anchor="start">The profile reaches the first-level hot-spot and stability threshold</text>
<rect x="108.84" y="184.14" width="642.3" height="267.63" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="209.14" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">[Tier 1: controlled deterministic plans and parameterized templates (the main</text>
<text x="429.98" y="232" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">consolidation layer, covering 90%+ of scenarios)]</text>
<text x="429.98" y="257.24" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Who it serves: frequently repeated business queries, periodically recurring dynamic scheduling</text>
<text x="429.99" y="277.29" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">constraints, stable customer process combinations</text>
<text x="429.98" y="301.24" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Consolidated artifacts:</text>
<text x="429.98" y="325.19" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">High-frequency queries → query IR + parameterized query plan / precompiled SQL statement</text>
<text x="429.98" y="345.24" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">(Prepared Plan)</text>
<text x="429.98" y="369.19" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">High-frequency rules → parameterized OSPF dynamic constraint template (Constraint Template)</text>
<text x="429.98" y="393.14" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">High-frequency expressions → high-performance compiled evaluator with a frozen symbol order</text>
<text x="429.99" y="413.19" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">(Compiled Evaluator)</text>
<text x="429.99" y="437.14" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Stable flows → standard workflow execution plan and tool-call chain template (Flow Plan)</text>
<text x="422.63" y="468.29" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<text x="85.45" y="481.64" font-family="'Noto Sans SC'" font-size="11.776px" font-weight="500" fill="rgb(91, 107, 123)" text-anchor="start">Only when the performance bottleneck is extremely clear, the benefit is sufficient and the product boundary is highly stable</text>
<rect x="108.84" y="488.25" width="642.3" height="173" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.98" y="513.22" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">[Tier 2: controlled code artifacts and VM plugins (the extreme-performance layer)]</text>
<text x="429.99" y="538.46" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Who it serves: core operators with ultra-high throughput requirements, complex custom evaluators or</text>
<text x="429.98" y="558.51" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">high-frequency dedicated query interfaces</text>
<text x="429.99" y="582.46" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Consolidated artifacts: controlled JVM-compiled query interface plugin / bytecode artifact /</text>
<text x="429.98" y="602.51" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">WebAssembly (Wasm) sandbox module</text>
<text x="429.99" y="626.46" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Non-negotiable safety rules: isolated build process, digital signature, dependency allowlist,</text>
<text x="429.99" y="646.51" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">CPU/memory limits, separate class loader / process</text>
</svg>
