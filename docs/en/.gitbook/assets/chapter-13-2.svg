<svg xmlns="http://www.w3.org/2000/svg" width="860" height="835" viewBox="0 0 860 835" role="img">
<rect x="0" y="0" width="860" height="834.44" rx="12" fill="rgb(251, 252, 254)" stroke="rgb(227, 230, 234)" stroke-width="1"/>
<rect x="108.84" y="18.66" width="642.3" height="41" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="43.77" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">Formal domain model + frozen scheduling solve snapshot</text>
<text x="422.63" y="76.21" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<rect x="108.84" y="83.19" width="642.3" height="64.94" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="108.17" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">1. OR builds the restricted master problem (RMP) / Benders master problem</text>
<text x="429.98" y="133.42" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Holds global hard constraints, current bounds and the convergence stopping criteria</text>
<text x="422.63" y="164.81" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<text x="170.59" y="177.91" font-family="'Noto Sans SC'" font-size="11.776px" font-weight="500" fill="rgb(91, 107, 123)" text-anchor="start">Issues the subproblem contract with master state, dual information and business boundaries</text>
<rect x="108.84" y="184.61" width="642.3" height="107.81" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="209.73" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">2. Machine learning / reinforcement learning (ML / RL learned subproblem</text>
<text x="429.99" y="232.59" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">accelerator)</text>
<text x="429.98" y="257.59" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Rapidly generates or ranks candidate columns, candidate cuts, candidate subproblem solutions or</text>
<text x="429.98" y="277.64" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">warm-start hints</text>
<text x="422.63" y="309.03" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<text x="351.25" y="322.13" font-family="'Noto Sans SC'" font-size="11.776px" font-weight="500" fill="rgb(91, 107, 123)" text-anchor="start">Submits internal candidates</text>
<rect x="108.84" y="328.91" width="642.3" height="85" rx="9" fill="rgb(255, 249, 242)" stroke="rgb(230, 126, 34)" stroke-width="1"/>
<text x="429.99" y="353.96" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(165, 91, 27)" text-anchor="middle">3. OR deterministic verification guard (OR Verification Guard)</text>
<text x="429.99" y="379.2" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Strictly checks domain hard-constraint feasibility, reduced cost, and the mathematical validity of</text>
<text x="429.99" y="399.25" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Benders cut planes and bounds</text>
<line x1="91.44" y1="418.08" x2="768.55" y2="418.08" stroke="rgb(164, 176, 190)" stroke-width="1"/>
<text x="253.34" y="434.64" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<text x="591.89" y="434.64" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<rect x="20.13" y="448.73" width="819.75" height="125.39" rx="10" fill="rgba(255, 255, 255, 0.6)" fill-opacity="0.6" stroke="rgb(185, 194, 203)" stroke-width="1" stroke-dasharray="5 4"/>
<text x="430" y="478.94" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 90, 104)" text-anchor="middle">Verification passed</text>
<rect x="256.05" y="497.55" width="347.89" height="63.81" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="522.69" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">Feed back into the master problem and keep</text>
<text x="429.98" y="545.3" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">iterating fast</text>
<rect x="20.13" y="590.28" width="819.75" height="148.2" rx="10" fill="rgba(255, 255, 255, 0.6)" fill-opacity="0.6" stroke="rgb(185, 194, 203)" stroke-width="1" stroke-dasharray="5 4"/>
<text x="429.99" y="620.59" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 90, 104)" text-anchor="middle">Verification failed or candidate gain insufficient</text>
<rect x="256.05" y="639.09" width="347.89" height="86.63" rx="9" fill="rgb(255, 249, 242)" stroke="rgb(230, 126, 34)" stroke-width="1"/>
<text x="429.99" y="664.1" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(165, 91, 27)" text-anchor="middle">4. Exact subproblem or deterministic</text>
<text x="429.99" y="686.96" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(165, 91, 27)" text-anchor="middle">heuristic mandatory fallback (Exact</text>
<text x="429.99" y="709.82" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(165, 91, 27)" text-anchor="middle">Fallback)</text>
<line x1="91.44" y1="747.8" x2="768.55" y2="747.8" stroke="rgb(164, 176, 190)" stroke-width="1"/>
<text x="253.34" y="764.19" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<text x="591.89" y="764.19" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<rect x="108.84" y="773.31" width="642.3" height="41" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="798.27" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">5. OR decides final convergence from the certified bounds and termination conditions</text>
</svg>
