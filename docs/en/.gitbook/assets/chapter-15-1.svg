<svg xmlns="http://www.w3.org/2000/svg" width="860" height="864" viewBox="0 0 860 864" role="img">
<rect x="0" y="0" width="860" height="863.44" rx="12" fill="rgb(251, 252, 254)" stroke="rgb(227, 230, 234)" stroke-width="1"/>
<rect x="108.84" y="18.66" width="642.3" height="64.94" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="43.77" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">Stage 1: Collection</text>
<text x="429.98" y="68.77" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Collect raw user intent, tool-call traces, general-path execution results and performance-cost facts</text>
<text x="422.63" y="100.16" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<rect x="108.84" y="107.13" width="642.3" height="85" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="132.13" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">Stage 2: Normalization</text>
<text x="429.99" y="157.37" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Extract stable business semantic structure from raw text and interactions, stripping concrete literal</text>
<text x="429.98" y="177.42" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">parameters and sensitive business values</text>
<text x="422.63" y="208.81" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<rect x="108.84" y="215.66" width="642.3" height="85" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.98" y="240.77" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">Stage 3: Intermediate Representation</text>
<text x="429.99" y="265.77" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Produce a hashable, versionable structured representation (Query IR / Constraint IR / Flow IR / Param</text>
<text x="429.98" y="286.06" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">IR)</text>
<text x="422.63" y="317.21" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<rect x="108.84" y="324.19" width="642.3" height="85" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.98" y="349.17" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">Stage 4: Verification &amp; Validation</text>
<text x="429.98" y="374.42" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Run strict checks on types, physical units, field catalog, tenant permissions, compute budget, approval</text>
<text x="429.99" y="394.46" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">status and semantic equivalence</text>
<text x="422.63" y="425.85" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<rect x="108.84" y="432.72" width="642.3" height="85" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.98" y="457.82" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">Stage 5: Optimization &amp; Promotion Decision</text>
<text x="429.99" y="483.06" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Weigh call frequency, latency, resource cost, stability and expected benefit to judge whether</text>
<text x="429.99" y="503.11" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">specialization is worth it</text>
<text x="422.63" y="534.26" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<rect x="108.84" y="541.25" width="642.3" height="85" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.99" y="566.22" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">Stage 6: Lowering</text>
<text x="429.98" y="591.46" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Compile into parameterized query plans, prepared statements, OSPF solver constraint templates, rule</text>
<text x="429.98" y="611.51" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">plans or controlled plug-ins</text>
<text x="422.63" y="642.9" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<rect x="108.84" y="649.78" width="642.3" height="85" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.98" y="674.87" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">Stage 7: Publishing</text>
<text x="429.98" y="700.11" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Complete shadow verification, canary release, plan registry registration, digital signing, immutable</text>
<text x="429.99" y="720.16" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">versioning and atomic traffic switchover</text>
<text x="422.63" y="751.3" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="700" fill="rgb(75, 123, 236)" text-anchor="start">↓</text>
<rect x="108.84" y="758.31" width="642.3" height="85" rx="9" fill="rgb(255, 255, 255)" stroke="rgb(75, 123, 236)" stroke-width="1"/>
<text x="429.98" y="783.27" font-family="'Noto Sans SC'" font-size="14.72px" font-weight="600" fill="rgb(29, 53, 87)" text-anchor="middle">Stage 8: Adaptation &amp; Deoptimization</text>
<text x="429.98" y="808.51" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">Keep monitoring hit rate and benefit; roll back automatically on anomaly; invalidate precisely and</text>
<text x="429.99" y="828.56" font-family="'Noto Sans SC'" font-size="12.9536px" font-weight="400" fill="rgb(91, 107, 123)" text-anchor="middle">recompile when schema, catalog or policy changes</text>
</svg>
