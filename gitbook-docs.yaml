$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: 从代码到意图 · From Code to Intent
  structure:
    - type: space
      key: book-zh
      title: 中文（简体）
      localizedTitle:
        en: Chinese (Simplified)
      path: zh
      default: true
      content:
        directory: ./docs/zh
        language: zh
    - type: space
      key: book-en
      title: English
      localizedTitle:
        zh: 英文
      path: en
      content:
        directory: ./docs/en
        language: en
